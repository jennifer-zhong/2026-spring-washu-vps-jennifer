    <style>
        body {
            margin: 0;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: white;
            border-bottom: 2px solid #c3c3c3;
            font-family: Helvetica, Arial, sans-serif;
        }

        .header-title h1 {
            margin: 0;
            font-size: 24px;
        }

        .header-title h1 a {
            text-decoration: none;
            color: #000000;
        }
        .header-title h1 a:hover {
            color: #e31313;
        }

        nav {
            display: flex;
            gap: 16px;
        }

        nav a {
            text-decoration: none;
            color: #353535;
            font-size: 14px;
            font-weight: 600;
        }

        nav a:hover {
            color: #0083da;
        }

        .collection-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px 36px;
            padding: 40px 28px 60px;
        }

        .object-box img {
            width: 90px;
            height: auto;
            display: block;
            transition: transform 0.2s ease;
        }

        .object-box:nth-child(5n + 1) {
            transform: translate(-12px, 10px) rotate(-4deg);
        }

        .object-box:nth-child(5n + 2) {
            transform: translate(10px, -6px) rotate(3deg);
        }

        .object-box:nth-child(5n + 3) {
            transform: translate(-4px, 18px) rotate(-2deg);
        }

        .object-box:nth-child(5n + 4) {
            transform: translate(14px, 4px) rotate(5deg);
        }

        .object-box:nth-child(5n) {
            transform: translate(-8px, -10px) rotate(-3deg);
        }

        .object-box:hover {
            transform: scale(1.06) rotate(0deg);
            z-index: 2;
        }
    </style>
    
</head>
