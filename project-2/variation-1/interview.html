<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Normal - Interview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: helvetica;
            background-color: #f5f5f5;
        }

        header {
            background-color: rgba(255, 255, 255, 0.7);
            border-bottom: 1px solid #e0e0e0;
            padding: 1.5rem 2rem;
            position: sticky;
            top: 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            backdrop-filter: blur(5px);
        }

        .header-title {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: baseline;
            gap: 2rem;
        }

        .header-title h1 {
            font-size: 1.75rem;
            font-weight: 600;
            color: #000;
        }

        .header-title h1 a {
            text-decoration: none;
            color: #000;
        }

        .header-title p {
            font-size: 0.85rem;
            color: #666;
            font-weight: 300;
        }

        nav {
            display: flex;
            gap: 2rem;
            justify-content: flex-end;
        }

        .page {
            text-decoration: none;
            color: #333;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            transition: color 0.3s ease;
            border-bottom: 2px solid transparent;
            padding-bottom: 0.25rem;
        }

        .page:hover {
            color: #000;
            border-bottom-color: #000;
        }

        @media (max-width: 768px) {
            header {
                padding: 1rem;
                gap: 0.75rem;
            }

            .header-title {
                flex-direction: column;
                justify-content: flex-start;
                align-items: flex-start;
                gap: 0.25rem;
            }

            .header-title h1 {
                font-size: 1.75rem;
            }

            .header-title p {
                font-size: 1rem;
                margin-bottom: 0.2rem;
            }

            nav {
                gap: 1rem;
                justify-content: flex-start;
                flex-wrap: wrap;
            }

            .page {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-title">
            <h1><a href="home.html">Super Normal</a></h1>
            <p>Naoto Fukasawa & Jasper Morrison</p>
        </div>
        <nav>
            <a class="page" href="about.html">ABOUT</a>
            <a class="page" href="index.html">INDEX</a>
            <a class="page" href="objects.html">OBJECTS</a>
            <a class="page" href="photos.html">PHOTOS</a>
            <a class="page" href="interview.html">INTERVIEW</a>
        </nav>
    </header>

    
</body>
</html>
