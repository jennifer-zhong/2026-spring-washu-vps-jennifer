<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Normal - Photos</title>
    <style>
        body {
            margin: 0;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: white;
            border-bottom: 2px solid #c3c3c3;
            font-family: Helvetica, Arial, sans-serif;
        }

        .header-title h1 {
            margin: 0;
            font-size: 24px;
        }

        .header-title h1 a {
            text-decoration: none;
            color: #000;
        }

        .header-title h1 a:hover {
            color: #198d1f;
        }

        nav {
            display: flex;
            gap: 16px;
        }

        nav a {
            text-decoration: none;
            color: #353535;
            font-size: 14px;
            font-weight: 600;
        }

        nav a[href$="about.html"]:hover {
            color: #e31313;
        }

        nav a[href$="index.html"]:hover {
            color: #daab00;
        }

        nav a[href$="photos.html"]:hover {
            color: #198d1f;
        }

        nav a[href$="interview.html"]:hover {
            color: #0083da;
        }

        .current-page {
            color: #198d1f;
        }

        body.menu-open {
            overflow: hidden;
        }

        .menu-toggle {
            display: none;
            position: relative;
            z-index: 220;
            border: 1px solid #a9a9a9;
            background: #fff;
            color: #353535;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 18px;
            font-weight: 700;
            line-height: 1;
            width: 36px;
            height: 36px;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .mobile-menu-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(255, 255, 255, 0.98);
            align-items: flex-start;
            justify-content: center;
            padding-top: 88px;
            box-sizing: border-box;
        }

        .mobile-menu-overlay.open {
            display: flex;
        }

        .mobile-menu-nav {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            font-family: Helvetica, Arial, sans-serif;
        }

        .mobile-menu-nav a {
            text-decoration: none;
            color: #353535;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.06em;
        }

        .mobile-menu-nav a[href$="about.html"]:hover {
            color: #e31313;
        }

        .mobile-menu-nav a[href$="index.html"]:hover {
            color: #daab00;
        }

        .mobile-menu-nav a[href$="photos.html"]:hover {
            color: #198d1f;
        }

        .mobile-menu-nav a[href$="interview.html"]:hover {
            color: #0083da;
        }

        .photo-figure {
            width: 100%;
            max-width: 800px;
            margin: 32px auto;
        }

        .photo-figure img {
            width: 100%;
            display: block;
        }

        .photo-figure figcaption {
            margin-top: 10px;
            font-family: courier, monospace;
            font-size: 15px;
            font-weight: 400;
            color: #4d4d4d;
            text-align: left;
        }

        footer {
            margin-top: 64px;
            padding: 24px 24px;
            font-family: Helvetica, Arial, sans-serif;
            text-align: center;
        }

        footer p {
            margin: 0;
            font-size: 14px;
            color: #666;
        }

        @media (max-width: 768px) {
            header {
                padding: 14px 16px;
            }

            header nav {
                display: none;
            }

            .menu-toggle {
                display: inline-flex;
                position: fixed;
                top: 14px;
                right: 16px;
            }
        }
    </style>
</head>
<body>
    <header>
         <div class="header-title">
            <h1><a href="/2026-spring-washu-vps-jennifer/project-2/variation-3/home2.html">Super Normal</a></h1>
        </div>
        <nav>
            <a class="page" href="/2026-spring-washu-vps-jennifer/project-2/variation-3/about.html">ABOUT</a>
            <a class="page" href="/2026-spring-washu-vps-jennifer/project-2/variation-3/index.html">INDEX</a>
            <a class="current-page" href="/2026-spring-washu-vps-jennifer/project-2/variation-3/photos.html">PHOTOS</a>
            <a class="page" href="/2026-spring-washu-vps-jennifer/project-2/variation-3/interview.html">INTERVIEW</a>
        </nav>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="mobile-menu" aria-label="Open navigation">☰</button>
    </header>

    <div class="mobile-menu-overlay" id="mobile-menu" aria-hidden="true">
        <nav class="mobile-menu-nav">
            <a href="/2026-spring-washu-vps-jennifer/project-2/variation-3/about.html">ABOUT</a>
            <a href="/2026-spring-washu-vps-jennifer/project-2/variation-3/index.html">INDEX</a>
            <a href="/2026-spring-washu-vps-jennifer/project-2/variation-3/photos.html">PHOTOS</a>
            <a href="/2026-spring-washu-vps-jennifer/project-2/variation-3/interview.html">INTERVIEW</a>
        </nav>
    </div>

    <figure class="photo-figure">
        <img src="/2026-spring-washu-vps-jennifer/project-2/variation-1/supernormal-header.png" alt="Axis Gallery in Japan">
        <figcaption><b>Super Normal objects in Axis Gallery, Japan.</b> Curated By Jasper Morrison & Naoto Fukasawa. </figcaption>
    </figure>

    <figure class="photo-figure">
        <img src="/2026-spring-washu-vps-jennifer/project-2/photo.png" alt="Super Normal objects">
        <figcaption>A few Super Normal objects in the collection. </figcaption>
    </figure>

    <figure class="photo-figure">
        <img src="/2026-spring-washu-vps-jennifer/project-2/photo3.png" alt="Close-up of Super Normal objects">
        <figcaption>Close-up view of 30. Table salt shaker, 31. Pepper mill, and 32. Sugar sifter.</figcaption>
    </figure>

    
    <script>
        (function () {
            var menuButton = document.querySelector('.menu-toggle');
            var menuOverlay = document.getElementById('mobile-menu');
            if (!menuButton || !menuOverlay) return;

            function setMenuOpen(isOpen) {
                document.body.classList.toggle('menu-open', isOpen);
                menuOverlay.classList.toggle('open', isOpen);
                menuButton.textContent = isOpen ? 'X' : '☰';
                menuButton.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
                menuButton.setAttribute('aria-label', isOpen ? 'Close navigation' : 'Open navigation');
                menuOverlay.setAttribute('aria-hidden', isOpen ? 'false' : 'true');
            }

            menuButton.addEventListener('click', function () {
                setMenuOpen(!menuOverlay.classList.contains('open'));
            });

            menuOverlay.addEventListener('click', function (event) {
                if (event.target === menuOverlay) {
                    setMenuOpen(false);
                }
            });

            menuOverlay.querySelectorAll('a').forEach(function (link) {
                link.addEventListener('click', function () {
                    setMenuOpen(false);
                });
            });
        })();
    </script>

    <footer>
        <p>© 2026 Super Normal  •  Curated by Jasper Morrison & Naoto Fukasawa</p>
    </footer>
</body>
</html>
