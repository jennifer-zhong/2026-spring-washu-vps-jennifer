    <title>Super Normal</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
        }

        .center-nav {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            font-family: Helvetica, Arial, sans-serif;
            text-align: center;
        }

        .center-nav h1 {
            margin: 0;
            font-size: clamp(38px, 7vw, 68px);
            line-height: 1;
            letter-spacing: 0.02em;
            white-space: nowrap;
        }

        .center-nav h1 a {
            text-decoration: none;
            color: #000000;
        }

        .center-nav h1 a:hover {
            color: #e31313;
        }

        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 14px;
        }

        nav a {
            text-decoration: none;
            color: #353535;
            font-size: 18px;
            font-weight: 600;
            padding: 4px 6px;
        }

        nav a:hover {
            color: #0083da;
        }

        .collection-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px 36px;
            padding: 40px 28px 60px;
        }

        @media (min-width: 701px) {
            .center-nav {
                pointer-events: none;
            }

            .center-nav a {
                pointer-events: auto;
            }

            .collection-grid {
                display: grid;
                grid-template-columns: repeat(6, minmax(64px, 1fr));
                gap: 24px 14px;
                padding: 40px 36px 60px;
            }

            .object-box {
                width: 100%;
                display: flex;
                justify-content: center;
            }

            .object-box:nth-child(8n + 1) { grid-column: 1; }
            .object-box:nth-child(8n + 2) { grid-column: 2; }
            .object-box:nth-child(8n + 3) { grid-column: 5; }
            .object-box:nth-child(8n + 4) { grid-column: 6; }
            .object-box:nth-child(8n + 5) { grid-column: 2; }
            .object-box:nth-child(8n + 6) { grid-column: 1; }
            .object-box:nth-child(8n + 7) { grid-column: 6; }
            .object-box:nth-child(8n) { grid-column: 5; }
        }

        @media (max-width: 700px) {
            .center-nav {
                background: rgba(255, 255, 255, 0.85);
                backdrop-filter: blur(8px);
                border-radius: 4px;
                padding: 12px 10px;
            }

            .center-nav h1 {
                font-size: clamp(30px, 10vw, 48px);
            }

            nav {
                flex-direction: column;
                align-items: center;
                gap: 8px;
            }

            nav a {
                font-size: 13px;
                letter-spacing: 0.08em;
                font-weight: 700;
                padding: 7px 14px;
                border: 1px solid #a9a9a9;
                background: rgba(255, 255, 255, 0.92);
            }

            nav a:hover {
                border-color: #0083da;
            }
        }

        .object-box img {
            width: 90px;
            height: auto;
            display: block;
            transition: transform 0.2s ease;
        }

        .object-box:nth-child(5n + 1) {
            transform: translate(-12px, 10px) rotate(-4deg);
        }

        .object-box:nth-child(5n + 2) {
            transform: translate(10px, -6px) rotate(3deg);
        }

        .object-box:nth-child(5n + 3) {
            transform: translate(-4px, 18px) rotate(-2deg);
        }

        .object-box:nth-child(5n + 4) {
            transform: translate(14px, 4px) rotate(5deg);
        }

        .object-box:nth-child(5n) {
            transform: translate(-8px, -10px) rotate(-3deg);
        }

        .object-box:hover {
            transform: scale(1.06) rotate(0deg);
            z-index: 2;
        }
    </style>
    
</head>
