<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Normal</title>
    <style>
        body {
            margin: 0;
            font-family: Helvetica, Arial, sans-serif;
            background: #ffffff;
        }

        .collection-grid {
            display: grid;
            grid-template-columns: minmax(140px, 1fr) minmax(240px, 30vw) minmax(140px, 1fr);
            gap: 16px 28px;
            padding: 26px 18px 40px;
            min-height: 100vh;
        }

        .center-hub {
            grid-column: 2;
            grid-row: 1 / span 300;
            position: sticky;
            top: 50vh;
            transform: translateY(-50%);
            text-align: center;
            align-self: start;
            z-index: 10;
        }

        .center-hub h1 {
            margin: 0;
            font-size: 42px;
            line-height: 0.95;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .center-hub h1 a {
            text-decoration: none;
            color: #000000;
        }

        .center-hub h1 a:hover {
            color: #e31313;
        }

        .center-nav {
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .center-nav a {
            text-decoration: none;
            color: #353535;
            font-size: 13px;
            letter-spacing: 0.08em;
            font-weight: 700;
            padding: 7px 14px;
            border: 1px solid #a9a9a9;
            background: #ffffff;
        }

        .center-nav a[href$="about.html"]:hover {
            color: #e31313;
            border-color: #e31313;
        }

        .center-nav a[href$="index.html"]:hover {
            color: #daab00;
            border-color: #daab00;
        }

        .center-nav a[href$="photos.html"]:hover {
            color: #198d1f;
            border-color: #198d1f;
        }

        .center-nav a[href$="interview.html"]:hover {
            color: #0083da;
            border-color: #0083da;
        }

        .object-box {
            justify-self: center;
            width: fit-content;
        }

        .object-box img {
            width: clamp(74px, 7.2vw, 98px);
            height: auto;
            display: block;
            transition: transform 0.2s ease;
        }

        .object-box:nth-of-type(5n + 1) {
            transform: translate(-12px, 10px) rotate(-4deg);
        }

        .object-box:nth-of-type(5n + 2) {
            transform: translate(10px, -6px) rotate(3deg);
        }

        .object-box:nth-of-type(5n + 3) {
            transform: translate(-4px, 18px) rotate(-2deg);
        }

        .object-box:nth-of-type(5n + 4) {
            transform: translate(14px, 4px) rotate(5deg);
        }

        .object-box:nth-of-type(5n) {
            transform: translate(-8px, -10px) rotate(-3deg);
        }

        .object-box:hover {
            transform: scale(1.06) rotate(0deg);
            z-index: 2;
        }

        footer {
            padding: 24px 24px;
            font-family: Helvetica, Arial, sans-serif;
            text-align: center;
        }

        footer p {
            margin: 0;
            font-size: 14px;
            color: #666;
        }

        footer a {
            text-decoration: none;
            color: #0083da;
        }

        footer a:hover {
            color: #e31313;
        }

        @media (max-width: 840px) {
            .collection-grid {
                grid-template-columns: 1fr;
                justify-items: center;
                gap: 18px;
                padding: 22px 12px 36px;
            }

            .center-hub {
                position: static;
                transform: none;
                grid-column: 1;
                grid-row: auto;
                margin-bottom: 8px;
            }

            .object-box {
                margin: 2px;
            }
        }
    </style>
    
</head>
